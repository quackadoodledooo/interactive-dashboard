<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <!-- Bootstrap  -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB" crossorigin="anonymous">
    <script defer src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js" integrity="sha384-FKyoEForCGlyvwx9Hj09JcYn3nv7wiPVlz7YYwJrWVcXK/BmnVDxM+D2scQbITxI" crossorigin="anonymous"></script>
    <link rel="stylesheet" href="css/style.css">
    <title>Interactive Dashboard</title>
</head>
<body>
    <h1>My Interactive Dashboard</h1>
    <p>This dashboard was created by Saurya for the WEB-115 course at Wake Tech</p>
    <script>document.write("This dashboard demonstrates how JavaScript can be used to create interactive websites.")</script>
    <noscript>Unfortunately, your web browser does not support JavaScript.</noscript>
    <div class="container">
    <div class="row">
        <!-- Dashboard Content -->
         <div class="col" id="weekly-tasks">
            <script src="js/task-manager.js" defer></script>
            <form>
                <input name="Name" id="name" type="text" placeholder="Name"/>
                <input name="Daily Task Goal" id="dailyGoal" type="number" placeholder="Daily Task goal"/>
                <input name="Weekly Bonus Tasks" id="bonusTasks" type="number" placeholder="Weekly Bonus Tasks"/>
                <button id="goal-btn" type="submit">Goal Button</button>
            </form>
            <p id="goal-message"></p>
            <div id="task-list"> 
                <h3>Weekly Task List</h3> 
                <p>Enter a task below to manage your goals.</p> 
                <form> 
                    <label for="task-name">Enter task:</label> 
                    <input type="text" id="task-name" name="task-name"> 
                    <button type="submit" id="add-task">Add Task</button> 
                </form> 
            </div>

         </div>

         <!-- Metric Converter -->
         <div class="col" id="metric-converter">
            <script src="js/metric-converter.js" defer></script>
            <form>
                <label for="convert">Enter a value to convert</label>
                <input name="Value to Convert" id="convert" type="text" placeholder="10">
                <label for="convert-type">Choose a conversion:</label>
                <select id="convert-type" name="conversion">
                    <option value="in to cm">Inches to Centimeters</option>
                    <option value="ft to cm">Feet to Centimeters</option>
                    <option value="yd to m">Yards to Meters</option>
                    <option value="mi to km">Miles to Kilometer</option>
                    <option value="cm to in">Centimeters to Inches</option>
                    <option value="cm to ft">Centimeters to Feet</option>
                    <option value="m to yd">Meters to Yards</option>
                    <option value="km to mi">Kilometers to Miles</option>
                </select>
                <button type="button" id="calculate">Calculate</button>
            </form>
            <p id="converter-output"></p>
         </div>

         <!-- Magic Eight Ball -->
         <div class="col" id="magic-eight-ball">
            <script src="js/magic-eight-ball.js" defer></script>
            <link rel="stylesheet" href="css/magic-eight-ball.css">
            <h2 class="heading">Magic Eight Ball</h2>
            <form>
            <p>Type a yes/no question below, then click on the Eight Ball below to get your answer!</p>
            <input id="question" name="question" size="80">
            <div id="magicEightBall">
                <div id="circle"></div>
                <img id="ball" src="img/magic-eight-ball.png"/>
            </div>
            <button id="reset" name="reset" type="reset">Ask another question</button>
            </form>
            <br>
        </div>
    </div>
</div>
</body>
</html>
